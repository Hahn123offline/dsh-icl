# ICL lab 覆盖层（--patch 用）：一条常驻、可控、可复跑的受试会话，不碰 desktop。
#
# 用法（不要手工 edit 后直接喂 dsh：这是模板，`__LAB_*__` 是占位符）：
#   node tools/lab.mjs up --preset icl-lab --port 57101
# `tools/lab.mjs` 会把占位符替换成当前 worktree 的绝对路径，物化到
# `.state/lab/<runId>/lab.patch.yml`，再以
#   dsh --profile web --patch <runDir>/lab.patch.yml --port <port> --no-open
# 启动一个**第二个 Web 实例**（独立进程、独立端口、独立 stateDir）。
#
# 为什么要物化：`--patch` 里 insert 的相对路径会锚定在 patch 文件旁边，
# 但 preset 的 `config.plugins` 是嵌套 entry list，Loader 不再做这个锚定，
# 所以 dsh-icl 的模块必须写成 file:// 绝对 URL。stateDir 也必须每次 run 独立。
# 直接安装成本 profile bundle 时（plugin manager）这些占位符由安装流程替换，
# 未替换的模板不可直接安装。
#
# ── SANDBOX-PLAN §7 试点（lab-only，不改 desktop profile）────────────────────
# 整个 lab 进程默认 workspace-write；workspaceRoot 只是"没有会话 cwd 的调用"的兜底，
# 普通会话仍以 session.header.cwd（lab 用 --workspace 指定）为写边界。
# permission 的 config 是整体替换，所以三个 preset 必须写全；danger-full-access 保留为回滚路径。
# workspaceRoot 是占位符：tools/lab.mjs 物化 patch 时替换成同一轮 --workspace 解析出的
# 绝对路径（默认 <rundir>/workspace，或 ICL_SANDBOX_WORKSPACE / ICL_ROOT/home）。
# 该目录的前置 ACL（Windows）：icacls <workspace> /grant '<user>:(OI)(CI)F'
# （缺这条时 ACL runner 会 SetNamedSecurityInfoW failed (Win32 5)，见 SANDBOX-PLAN §2.4）。
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: '__LAB_WORKSPACE__'
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write
- insert:
    - id: dsh-icl-lab-host
      name: '__LAB_ICL_HOST__'
    # 第一里程碑用的全量 ICL 预设：不含 mc-link，先证明"能聊、能记、能看状态"。
    - id: preset-icl-lab
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: icl-lab
        name: ICL Lab
        description: 实验/受试会话：独立状态、秒级 tick、ICL 全套插件（不含 MC）。
        order: 31
        plugins:
          - id: icl-lab-core
            name: '__LAB_ICL_CORE__'
            config:
              presetId: icl-lab
              stateDir: '__LAB_STATE__/icl-lab'
              personaFile: prompts/persona.md
              simulationFile: prompts/sim.md
              tickMs: 200
              timeTickMs: 1000
              # 第一屏净化（红队 P0-1，lab 先验证；产品 preset 要开需用户批准）：
              # 在 agent scope 注册同名空段，shadow 掉 DSH 全局的工程脚手架段。
              # 段名/顺序见 src/purify.mjs；空文本段会被渲染层跳过。
              purifySections:
                - 'harness:identity'
                - 'ui:deliverable-file-references'
                - 'harness:source'
                - 'app:web-surface'
              pluginConfig:
                time:
                  # 测试/复核用：允许 inbox clock 命令平移 time 看到的时钟（跨小时前缀复核）。
                  testClock: true
              # dream-chat / embed-text 插槽必须有 providers，否则 dream 的 events/people/lexicon/cleanup
              # 等需要模型的 job 会整段缺席（night-1 事故：只有 wash/consume/index）。
              # lab 复用 8088 llama-swap（chat: qwen35-9b / embedding: embed-bge-m3(1024d) / clip-zh(512d, CPU，用于 album 图片记忆)），零成本、无 API key。
              providers:
                - id: lab-llama-swap-chat
                  kind: chat
                  shape: { tools: false }
                  baseUrl: 'http://127.0.0.1:8088/v1'
                  model: qwen35-9b
                  timeoutMs: 120000
                  disableThinking: true
                - id: lab-bge-m3
                  kind: embedding
                  shape: { dim: 1024 }
                  baseUrl: 'http://127.0.0.1:8088/v1'
                  model: embed-bge-m3
                - id: lab-clip-zh
                  kind: embedding
                  shape: { dim: 512 }
                  baseUrl: 'http://127.0.0.1:8088/v1'
                  model: clip-zh
                  timeoutMs: 30000
              plugins:
                - memory
                - world-state
                - recall
                - note
                - lexicon
                - whois
                - persona
                - focus
                - eager-recall
                - model-manager
                - time
                - dream
                # editor 已下线（SANDBOX-PLAN §4.2）：它用 node:fs 直写、根是 stateDir，
                # 在 workspace-write 下能绕过写边界。文件能力改由下面的原生工具提供。
                - bili
                - album
                - video
                - loop-probe
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 原生文件/命令工具（SANDBOX-PLAN §4.2）：read/write/edit/read_image + glob/grep + pwsh。
          # 它们走 ctx.fs / ctx.shell，因此受 workspace-write 与 pwsh-sandbox 约束。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          # 覆盖 DSH 全局 coding-agent 身份（与 ICL 人格段冲突，见 docs/PROMPT-CONTRACT.md）
          - id: tool-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: 'Your working directory is {{cwd}}.'
    # 第二里程碑：在上面的基础上加 mc-link；body 用 mc-lab 自己的端口（54900），
    # bot 名 ICL-mclab-1（配置层默认值，避免与 mc-link 的 ICL/ICL-mclink-1 同名被踢）。
    - id: preset-icl-mc-lab
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: icl-mc-lab
        name: ICL MC Lab
        description: lab 里的 MC 受试会话：独立状态 + mc-link，body 独立端口。
        order: 32
        plugins:
          - id: icl-mc-lab-core
            name: '__LAB_ICL_CORE__'
            config:
              presetId: icl-mc-lab
              stateDir: '__LAB_STATE__/icl-mc-lab'
              personaFile: prompts/persona.md
              simulationFile: prompts/sim.md
              tickMs: 200
              timeTickMs: 1000
              # 第一屏净化（红队 P0-1）：与 icl-lab 同 4 段 shadow；产品 preset 要开需用户批准。
              purifySections:
                - 'harness:identity'
                - 'ui:deliverable-file-references'
                - 'harness:source'
                - 'app:web-surface'
              mcBaseUrl: '__LAB_MC_BASE__'
              # 同 icl-lab：dream-chat/embed-text 插槽必须有 providers，否则 dream 的
              # events/people/lexicon/cleanup 等 job 会整段缺席（night-1 只跑了 wash/consume/index）。
              providers:
                - id: lab-llama-swap-chat
                  kind: chat
                  shape: { tools: false }
                  baseUrl: 'http://127.0.0.1:8088/v1'
                  model: qwen35-9b
                  timeoutMs: 120000
                  disableThinking: true
                - id: lab-bge-m3
                  kind: embedding
                  shape: { dim: 1024 }
                  baseUrl: 'http://127.0.0.1:8088/v1'
                  model: embed-bge-m3
                - id: lab-clip-zh
                  kind: embedding
                  shape: { dim: 512 }
                  baseUrl: 'http://127.0.0.1:8088/v1'
                  model: clip-zh
                  timeoutMs: 30000
              # MC 场景工具白名单（P1 复杂度收敛，用户/lead 批准；只在 lab 生效）：
              # E2 实测 48 工具里 31 个一次没调用；MC 会话只留 mcb_* + 时间安排 + 记忆/待办。
              # 支持精确名与 `前缀*`；空数组 = 全量（产品默认不变）。DSH 原生工具（todo 等）不受影响。
              toolAllowlist:
                - 'mcb_*'
                - time_status
                - time_arrange
                - remember
                - recall
                - forget
                - memo
                - memo_append
                - memo_commit
                - memos
              pluginConfig:
                time:
                  # E2 时序收敛（用户/lead 批准）：清醒节拍 120s→30s，goal 续推 60s→30s。
                  # 目标：turn-gap p95 从 121s 降到 ≤40s（S1 实测 121/154s）。
                  awakeTick:
                    mode: __LAB_AWAKE_MODE__
                    idleSec: __LAB_AWAKE_IDLE__
                    minIdleSec: __LAB_AWAKE_MIN_IDLE__
                  goalResumeMinGapSec: __LAB_GOAL_GAP__
                mc-link:
                  listenPort: __LAB_MC_PORT__
                  # 默认 username 是 ICL；lab 用占位符，白天验收 ICL-mclab-1、夜间长测 ICL-night-1。
                  username: '__LAB_MC_USERNAME__'
                  # 默认 stateDir 会落到仓库根 .state/mc-live；lab 必须自带。
                  stateDir: '__LAB_STATE__/mc-body'
                  # lab 自己的服务器清单（含正常地形验收服 lab-normal:54840）。
                  serversFile: '__LAB_MC_SERVERS__'
                loop-probe:
                  # 夜测专用：lab/supervisor 重启时不要把 time/focus 状态 reset 掉，
                  # 否则 time 自己的"跨重启恢复"（sleep span/queue/fired）永远验证不到。
                  resetOnStart: false
              plugins:
                - memory
                - world-state
                - recall
                - note
                - lexicon
                - whois
                - persona
                - focus
                - eager-recall
                - model-manager
                - time
                - dream
                - editor
                - mc-link
                - album
                - loop-probe
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 覆盖 DSH 全局 coding-agent 身份（与 ICL 人格段冲突，见 docs/PROMPT-CONTRACT.md）
          - id: tool-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: 'Your working directory is {{cwd}}.'
    - id: preset-icl-e2
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: icl-e2
        name: ICL E2
        description: E2 24h 长测专用（lab-only）：awakeTick 30s、goal 续推 30s、工具面收敛、文案精简。
        order: 33
        plugins:
          - id: icl-e2-core
            name: '__LAB_ICL_CORE__'
            config:
              presetId: icl-e2
              stateDir: '__LAB_STATE__/icl-e2'
              personaFile: prompts/persona.md
              simulationFile: prompts/sim.md
              tickMs: 200
              timeTickMs: 1000
              purifySections:
                - 'harness:identity'
                - 'ui:deliverable-file-references'
                - 'harness:source'
                - 'app:web-surface'
              mcBaseUrl: '__LAB_MC_BASE__'
              providers:
                - id: lab-llama-swap-chat
                  kind: chat
                  shape: { tools: false }
                  baseUrl: 'http://127.0.0.1:8088/v1'
                  model: qwen35-9b
                  timeoutMs: 120000
                  disableThinking: true
                - id: lab-bge-m3
                  kind: embedding
                  shape: { dim: 1024 }
                  baseUrl: 'http://127.0.0.1:8088/v1'
                  model: embed-bge-m3
                - id: lab-clip-zh
                  kind: embedding
                  shape: { dim: 512 }
                  baseUrl: 'http://127.0.0.1:8088/v1'
                  model: clip-zh
                  timeoutMs: 30000
              pluginConfig:
                time:
                  testClock: true
                  awakeTick:
                    idleSec: 30
                  goalResumeMinGapSec: 30
                mc-link:
                  listenPort: __LAB_MC_PORT__
                  username: '__LAB_MC_USERNAME__'
                  stateDir: '__LAB_STATE__/mc-body'
                  serversFile: '__LAB_MC_SERVERS__'
                loop-probe:
                  resetOnStart: false
              plugins:
                - memory
                - note
                - recall
                - persona
                - eager-recall
                - model-manager
                - time
                - dream
                - mc-link
                # album 只加载服务；e2 的 toolAllowlist 不暴露 album_* 工具。
                - album
                - loop-probe
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: 'Your working directory is {{cwd}}.'
