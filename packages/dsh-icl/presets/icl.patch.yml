# ICL 的 DSH agent preset。
#
# 这个文件随 bundle 安装；插件 code 在 ../../index.mjs，默认值由仓库推出。
# 只把 agent 选到这个 preset，ICL 才会接管工具面、人格与投递。
#
# 路径约定：stateDir 之类的"数据路径"相对 ICL_ROOT 解析（默认 <REPO_ROOT>/.state），
# 不写盘符；只读资产（personaFile 等）相对仓库根解析。换盘/整体迁移见 docs/PATHS.md。
#
# 注意：tool-persona.suffix 必须为空（不能引用 {{cwd}}）。desktop 内置 DSH（app.asar）的
# agent-loop 只注册 provider/model 变量，不注册 cwd；引用 {{cwd}} 会让每个 turn 在模型请求前
# 直接失败（unknown prompt variable）。lab 用的 npm DSH 有 cwd，但产品 preset 以 desktop 为准。
- insert:
    - id: dsh-icl-host
      name: ../host.mjs
      config:
        presetId: icl
        # 消息到达时由 bridge 走 DSH 官方 apiProxy.sessions.prompt 冷恢复并投递
        # （见 bridge.mjs）；不再由 Host 自己猜时机 resume。
        autoResume: false
    - id: preset-icl
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: icl
        name: ICL
        description: 带记忆、时间与作息的会话：工具面与人格由 dsh-icl 在进程内注入。
        order: 11
        plugins:
          - id: icl-core
            name: dsh-icl/index.mjs
            config:
              presetId: icl
              contextWindow: 256000
              # 产品化 A1（2026-11-06，lead 批准）：首屏净化 4 段 + 显式插件白名单（去 mc-link）。
              # MC 暂下线（2026-11-08）：icl-mc preset 已移除；产品工具面 66/44,316 → 49/31,824。
              purifySections:
                - 'harness:identity'
                - 'ui:deliverable-file-references'
                - 'harness:source'
                - 'app:web-surface'
              plugins:
                - memory
                - world-state
                - recall
                - note
                - lexicon
                - whois
                - persona
                - focus
                - eager-recall
                - model-manager
                - time
                - dream
                - editor
                - bili
                - video
                - album
                - qq
              # QQ 私聊（真机已验证）：只接 owner 私聊；出站三把钥匙打开但只允许 owner。
              # SnowLuma 安装目录/账号由插件自动发现（~/Downloads/SnowLuma-*），不写死用户名。
              pluginConfig:
                # 本地视觉描述服务停用：多模态模型直接看图；GIF 需要切帧时走 video_storyboard。
                album:
                  captionEnabled: false
                # 清醒节拍默认关闭：不外部定时注入"该醒了"；唤醒由模型用 time_arrange 闹钟/
                # 时间安排自己定。产品显式写死 false，避免未来默认值漂移。
                time:
                  awakeTick:
                    enabled: false
                  # 2026-11-15 用户拍板：条件/自适应心跳。没有等的事就不叫醒；无事间隔逐渐拉长。
                  # longSilenceSec:0 = 关闭"长静默"turn（只保留有 pending 的唤醒）；
                  # 空状态仍按 idleCheckMaxSec 定期检查（不产生 turn）。conditional:false 回滚旧行为。
                  heartbeat:
                    conditional: true
                    longSilenceSec: 0
                    idleCheckMaxSec: 3600
                    backoffFactor: 1.5
                    maxBackoffMul: 12
                # v3（2026-11-12 用户拍板）：经历块（episode）为召回主单位，typed 降级为块内注释。
                recall:
                  schema: v3
                eager-recall:
                  schema: v3
                  # 低于注入阈值但有相关记忆时，只给一行"可能记得"提示（不注入内容）。
                  hintThreshold: 0.33
                  hintCooldownMs: 300000
                # whois 与 recall/eager 同 schema：v3 只读 episode/annotations，不读归档的 v2 namespace。
                whois:
                  schema: v3
                # 记忆状态行加进 world 状态段；给 memory 一行加空间（仍由 world 截断）。
                world-state:
                  maxChars: 320
                # 产品不再自动排 nightly dream；睡眠时按 dream 标志触发。
                dream:
                  scheduleEnabled: false
                  memorySchema: 'v3'
                  # 2026-11-14 用户确认：dream 是唯一分区者；段由本次 dream 切点决定，
                  # 时间只做参考；已迁移历史 day log 为 legacy 段并初始化 cursor。
                  partition: segment
                  segmentCursorInit: head
                  # 身份链的产品已知事实（2026-11-11）：人物档案按账号归一，显示名只是 alias。
                  selfQQ: '2593621742'
                  ownerQQ: '3429502459'
                  ownerNames:
                    - '主人'
                    - 'Hahn123'
                    - 'Hahn123（离线版）'
                    - '周子涵'
                  selfNames:
                    - '鱼鱼'
                    - '小千'
                  # 群号不是人的账号：模型偶尔把群号写进 person.ids（曾嘉睿案例）。
                  groupIds:
                    - '601357169'
                    - '1057812765'
                qq:
                  enabled: true
                  ownerQQ: '3429502459'
                  selfId: '2593621742'
                  # 私聊图片/表情自动进相册；群图默认不自动收（避免默默收藏群友图片）。
                  autoAlbum: true
                  autoAlbumGroups: false
                  allowPrivate:
                    - '3429502459'
                  allowAllPrivate: false
                  # 2026-11-16：私聊白名单改为"QQ 好友列表"（控制账号点通过好友 = 白名单），
                  # allowPrivate 仍保留为主人兜底；HTTP 不可用时只收 allowPrivate。
                  privatePolicy: friends
                  friendSyncMs: 300000
                  # G1 群聊只读：两个旧的小群；普通群消息进 focus backlog，@ 直达。
                  groupPolicy: allowlist
                  allowGroups:
                    - '601357169'
                    - '1057812765'
                  # G2：qq_send 的 to 直接接受群号；群管理动作仍单独开关（默认关）。
                  allowGroupSend: true
                  allowGroupAdmin: false
                  allowGroupAtAll: false
                  allowGroupMute: true
                  muteGroups: []
                  allowPoke: true
                  allowRecall: true
                  allowSend: true
                  allowMediaSend: true
                  maxMediaPerTurn: 3
                  maxMediaPerHour: 20
                  maxSendImageBytes: 10485760
                  maxSendVideoBytes: 268435456
                  maxSendFileBytes: 536870912
                  maxSendVoiceBytes: 16777216
                  sendApproval: 'lead-approved'
                  # 多气泡发送中被同会话插话：当前气泡发完后停，等 2s 让插话说完再返回模型。
                  interruptGraceMs: 2000
                  snowlumaHomeDir: 'auto'
                  # Phase 2 出站短队列：限流时排队，短队列满/过期才拒绝；全局每分钟 24 条。
                  outboxEnabled: true
                  outboxMaxPending: 20
                  outboxTtlMs: 300000
                  # 按下一句字数估打字时间，而不是所有气泡固定 1–3s。
                  gapMode: adaptive
                  # 不做发送条数限流：她需要连说几句时不该被“本轮最多 1 条”打断。
                  maxSendsPerTurn: 0
                  sendMaxPerMinute: 0
                  sendMaxPerHour: 0
                  globalSendMaxPerMinute: 0
                  # 不在发送后自动 replyCheck：那会在回合结束后额外叫醒一次。
                  replyCheckEnabled: false
                  # 入站防抖：群聊/连发先攒 6s 再合成一次投递；最长 20s 必须交。
                  inboundDebounce:
                    enabled: true
                    quietMs: 6000
                    mentionQuietMs: 3000
                    maxHoldMs: 20000
                    maxBatchMessages: 20
                    # 群普通消息一律 ambient（只进该群 backlog，等她自己看）；@ 才直达。
                    groupQuietMs: 6000
                    groupMentionQuietMs: 3000
                    groupMaxHoldMs: 20000
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 覆盖 DSH 全局 coding-agent 身份（与 ICL 人格段冲突，见 docs/PROMPT-CONTRACT.md）
          - id: tool-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: ''
    # 闭环测试专用：独立 stateDir，不碰用户 ICL 的记忆/时间/focus。
    - id: preset-icl-loop
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: icl-loop
        name: ICL Loop
        description: 闭环测试会话：独立状态、短 tick、loop-probe 外部信号注入。
        order: 12
        plugins:
          - id: icl-loop-core
            name: dsh-icl/index.mjs
            config:
              presetId: icl-loop
              stateDir: loop-state
              personaFile: prompts/persona.md
              simulationFile: prompts/sim.md
              tickMs: 200
              timeTickMs: 1000
              plugins:
                - memory
                - world-state
                - recall
                - note
                - lexicon
                - whois
                - persona
                - focus
                - eager-recall
                - model-manager
                - time
                - dream
                - editor
                - bili
                - loop-probe
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 覆盖 DSH 全局 coding-agent 身份（与 ICL 人格段冲突，见 docs/PROMPT-CONTRACT.md）
          - id: tool-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: ''
