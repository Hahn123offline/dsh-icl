# ICL 的 DSH agent preset。
#
# 这个文件随 bundle 安装；插件 code 在 ../../index.mjs，默认值由仓库推出。
# 只把 agent 选到这个 preset，ICL 才会接管工具面、人格与投递。
#
# 路径约定：stateDir 之类的"数据路径"相对 ICL_ROOT 解析（默认 <REPO_ROOT>/.state），
# 不写盘符；只读资产（personaFile 等）相对仓库根解析。换盘/整体迁移见 docs/PATHS.md。
- insert:
    - id: dsh-icl-host
      name: ../host.mjs
    - id: preset-icl
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: icl
        name: ICL
        description: 带记忆、时间与作息的会话：工具面与人格由 dsh-icl 在进程内注入。
        order: 11
        plugins:
          - id: icl-core
            name: dsh-icl/index.mjs
            config:
              presetId: icl
              # 产品化 A1（2026-11-06，lead 批准）：首屏净化 4 段 + 显式插件白名单（去 mc-link）。
              # MC 只走 icl-mc 场景；产品工具面 66/44,316 → 49/31,824。
              purifySections:
                - 'harness:identity'
                - 'ui:deliverable-file-references'
                - 'harness:source'
                - 'app:web-surface'
              plugins:
                - memory
                - world-state
                - recall
                - note
                - lexicon
                - whois
                - persona
                - focus
                - eager-recall
                - model-manager
                - time
                - dream
                - editor
                - bili
                - video
                - album
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 覆盖 DSH 全局 coding-agent 身份（与 ICL 人格段冲突，见 docs/PROMPT-CONTRACT.md）
          - id: tool-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: 'Your working directory is {{cwd}}.'
    # 闭环测试专用：独立 stateDir，不碰用户 ICL 的记忆/时间/focus。
    - id: preset-icl-loop
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: icl-loop
        name: ICL Loop
        description: 闭环测试会话：独立状态、短 tick、loop-probe 外部信号注入。
        order: 12
        plugins:
          - id: icl-loop-core
            name: dsh-icl/index.mjs
            config:
              presetId: icl-loop
              stateDir: loop-state
              personaFile: prompts/persona.md
              simulationFile: prompts/sim.md
              tickMs: 200
              timeTickMs: 1000
              plugins:
                - memory
                - world-state
                - recall
                - note
                - lexicon
                - whois
                - persona
                - focus
                - eager-recall
                - model-manager
                - time
                - dream
                - editor
                - bili
                - loop-probe
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 覆盖 DSH 全局 coding-agent 身份（与 ICL 人格段冲突，见 docs/PROMPT-CONTRACT.md）
          - id: tool-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: 'Your working directory is {{cwd}}.'
    - id: preset-icl-mc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: icl-mc
        name: ICL MC
        description: ICL + MC 只读观察接缝：真实局域网事件进 signals，默认只读、限速发言。
        order: 13
        plugins:
          - id: icl-mc-core
            name: dsh-icl/index.mjs
            config:
              presetId: icl-mc
              stateDir: mc-state
              personaFile: prompts/persona.md
              simulationFile: prompts/sim.md
              tickMs: 500
              timeTickMs: 1000
              mcBaseUrl: http://127.0.0.1:54836
              plugins:
                - memory
                - world-state
                - recall
                - note
                - lexicon
                - whois
                - persona
                - focus
                - eager-recall
                - model-manager
                - time
                - dream
                - editor
                - mc-link
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # 覆盖 DSH 全局 coding-agent 身份（与 ICL 人格段冲突，见 docs/PROMPT-CONTRACT.md）
          - id: tool-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              suffix: 'Your working directory is {{cwd}}.'
